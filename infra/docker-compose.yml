services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
      POSTGRES_DB: sage_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      - sage_net

  redis:
    image: redis:7
    ports: ["6379:6379"]
    networks:
      - sage_net

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - sage_net

volumes:
  pgdata:
    
networks:
  sage_net:
    external: true
    name: sage_net
