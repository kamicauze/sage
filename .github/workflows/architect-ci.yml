name: Architect CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/architect-ci.yml"
      - "apps/architect-studio/**"
      - "shared/**"
      - "tests/test_architect_*.py"
      - "scripts/ci/**"
      - "docs/ARCHITECT_HARDENING_SPRINT_BOARD.md"
  pull_request:
    paths:
      - ".github/workflows/architect-ci.yml"
      - "apps/architect-studio/**"
      - "shared/**"
      - "tests/test_architect_*.py"
      - "scripts/ci/**"
      - "docs/ARCHITECT_HARDENING_SPRINT_BOARD.md"

jobs:
  architect-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/architect-studio/api/requirements.txt
          python -m pip install aiohttp aiofiles watchdog aiomqtt ruff

      - name: Run Architect checks
        run: |
          bash scripts/ci/run_architect_checks.sh

      - name: Upload CI triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-ci-logs
          if-no-files-found: warn
          path: |
            artifacts/ci/*.log
            artifacts/ci/*.txt
